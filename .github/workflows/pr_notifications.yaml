name: PR notifications

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - ready_for_review

permissions: {}

jobs:
  pr-notifications:
    name: Send PR notifications
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/subflow_send_telegram_notification.yaml
    with:
      notification_type: pull_request
    secrets:
      TELEGRAM_CHAT_ID: |
        ${{ secrets.TELEGRAM_NOTIFICATIONS_CHAT_ID }}
        ${{ secrets.TELEGRAM_K8S_OPERATOR_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
