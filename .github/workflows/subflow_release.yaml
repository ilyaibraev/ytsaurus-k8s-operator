on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      release_suffix:
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Run release
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # https://github.com/actions/setup-go
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            **/go.mod
            ${{ job.workflow_file_path }}

      # https://github.com/Azure/setup-helm
      # https://github.com/helm/helm/releases
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.6

      - name: Build
        shell: bash
        run: |
          make build

      - name: Docker Hub login
        if: env.HAS_DOCKER_HUB_SECRETS == 'true'
        env:
          HAS_DOCKER_HUB_SECRETS: ${{ secrets.DOCKER_HUB_LOGIN != '' && secrets.DOCKER_HUB_PASSWORD != '' }}
          DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_LOGIN }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        shell: bash
        run: |
          printenv DOCKER_HUB_PASSWORD | docker login --username "${DOCKER_HUB_LOGIN}" --password-stdin

      # Uses the `docker/login-action` action to log in to the Container registry
      # using the account and password that will publish the packages.
      # Once published, the packages are scoped to the account defined here.
      - name: Guthub Packages Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: env.HAS_DOCKER_HUB_SECRETS == 'true'
        shell: bash
        env:
          HAS_DOCKER_HUB_SECRETS: ${{ secrets.DOCKER_HUB_LOGIN != '' && secrets.DOCKER_HUB_PASSWORD != '' }}
        run: |
          make release RELEASE_VERSION=${{ inputs.release_version }} RELEASE_SUFFIX=${{ inputs.release_suffix }}

  send-notifications:
    name: Send notifications
    needs: release
    if: ${{ failure() }}
    permissions: {}
    uses: ./.github/workflows/subflow_send_telegram_notification.yaml
    with:
      notification_type: workflow_failure
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
