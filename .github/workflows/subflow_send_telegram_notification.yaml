name: Send Telegram notification

on:
  workflow_call:
    inputs:
      notification_type:
        description: One of issue, pull_request, or workflow_failure.
        required: true
        type: string
    secrets:
      TELEGRAM_CHAT_ID:
        description: Chat IDs separated by commas or newlines.
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

permissions: {}

jobs:
  send:
    name: Send Telegram notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        shell: bash
        # Keep event data in env so it cannot become shell code or template expressions.
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFICATION_TYPE: ${{ inputs.notification_type }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
          WORKFLOW: ${{ github.workflow }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.head_commit.id || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "${TELEGRAM_CHAT_ID//[[:space:],]/}" ]]; then
            echo 'Telegram notifications are not configured; skipping.'
            exit 0
          fi

          escape_html() {
            local value=$1
            value=${value//&/\&amp;}
            value=${value//</\&lt;}
            value=${value//>/\&gt;}
            printf '%s' "$value"
          }

          case "$NOTIFICATION_TYPE" in
            issue)
              printf -v message 'New issue in <b>%s</b>: <code>%s</code>\n%s' \
                "$(escape_html "$REPOSITORY")" \
                "$(escape_html "$ISSUE_TITLE")" \
                "$(escape_html "$ISSUE_URL")"
              ;;
            pull_request)
              printf -v message 'New PR in <b>%s</b>: <code>%s</code>\n%s' \
                "$(escape_html "$REPOSITORY")" \
                "$(escape_html "$PULL_REQUEST_TITLE")" \
                "$(escape_html "$PULL_REQUEST_URL")"
              ;;
            workflow_failure)
              printf -v message 'Workflow <b>%s</b> failed: %s.\nCommit: %s\nMessage:\n<pre>%s</pre>' \
                "$(escape_html "$WORKFLOW")" \
                "$(escape_html "$WORKFLOW_URL")" \
                "$(escape_html "$COMMIT_SHA")" \
                "$(escape_html "$COMMIT_MESSAGE")"
              ;;
            *)
              printf 'Unsupported notification type: %s\n' "$NOTIFICATION_TYPE" >&2
              exit 1
              ;;
          esac

          chat_id_list="${TELEGRAM_CHAT_ID//$'\n'/,}"
          IFS=',' read -r -a chat_ids <<< "$chat_id_list"
          for chat_id in "${chat_ids[@]}"; do
            chat_id="${chat_id#"${chat_id%%[![:space:]]*}"}"
            chat_id="${chat_id%"${chat_id##*[![:space:]]}"}"
            [[ -n $chat_id ]] || continue

            curl --fail --silent --show-error --output /dev/null \
              --request POST \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${message}" \
              --data-urlencode 'parse_mode=HTML' \
              --data-urlencode 'link_preview_options={"is_disabled":true}' \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          done
